<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-quantum-safe-title hero-quantum-safe-desc" class="w-full h-auto"><title id="hero-quantum-safe-title">A message sealed by two layers of protection</title><desc id="hero-quantum-safe-desc">A classic Nostr key exchange wrapped in an outer post-quantum shell, with a locked envelope at the center representing a hybrid-protected direct message.</desc><defs><radialGradient id="bg-quantum-safe" cx="0.5" cy="0.5" r="0.7"><stop offset="0%" stop-color="#1e2812"></stop><stop offset="100%" stop-color="#0a0a0a"></stop></radialGradient><radialGradient id="quantum-safe-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#b4f953" stop-opacity="0.45"></stop><stop offset="100%" stop-color="#b4f953" stop-opacity="0"></stop></radialGradient></defs><rect width="800" height="400" fill="url(#bg-quantum-safe)"></rect><circle cx="400" cy="200" r="150" fill="url(#quantum-safe-glow)"  style="transform-origin:400px 200px;transform-box:fill-box"></circle><rect x="150" y="80" width="500" height="240" rx="28" fill="none" stroke="#b4f953" stroke-opacity="0.35" stroke-width="2"></rect><rect x="220" y="130" width="360" height="140" rx="18" fill="none" stroke="#b4f953" stroke-opacity="0.75" stroke-width="2"></rect><circle cx="400" cy="200" r="32" fill="#b4f953" fill-opacity="0.14" stroke="#b4f953" stroke-width="2"></circle><path d="M388 198v-10a12 12 0 0 1 24 0v10" fill="none" stroke="#b4f953" stroke-width="2.4" stroke-linecap="round"></path><rect x="385" y="198" width="30" height="22" rx="5" fill="#b4f953" fill-opacity="0.85"></rect><g font-size="11" font-weight="600"><rect x="40" y="18" width="16" height="12" rx="3" fill="none" stroke="#b4f953" stroke-opacity="0.75" stroke-width="1.5"></rect><text x="64" y="28" fill="#fafafa">classic key exchange</text><rect x="230" y="18" width="16" height="12" rx="3" fill="none" stroke="#b4f953" stroke-opacity="0.35" stroke-width="1.5"></rect><text x="254" y="2